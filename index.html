<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The same emblem, at the same path, as the one surima.id serves. -->
    <link rel="icon" href="/assets/logo/surima-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SURIMA Academy — Riichi Mahjong Trainer</title>
    <meta name="description" content="Learn riichi mahjong from the tiles up: hand shapes, yaku, han, fu, scoring, and tile efficiency, with generated drills." />
    <!-- One theme, the felt table, whatever the visitor's OS prefers. See `index.css`. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f261c" />
    <!--
      Inter for prose, JetBrains Mono for notation and the score tables. Both are
      declared with `display=swap` and sit in front of a full system fallback
      stack in `index.css`, so the app renders immediately and stays legible if
      the request never lands.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
