[build]
  command = "npm run build"
  publish = "dist"

# The app routes client-side, so every path must serve index.html rather than
# 404 when someone opens /fu directly or refreshes a lesson page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
